# GridBoard dev compose — hot reload for client and server
# Usage: docker compose -f docker-compose.dev.yml up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridboard
      POSTGRES_PASSWORD: gridboard
      POSTGRES_DB: gridboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gridboard:gridboard@postgres:5432/gridboard
      JWT_SECRET: dev-only-jwt-secret-change-me
      STORAGE_BACKEND: minio
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: gridboard-assets
      S3_FORCE_PATH_STYLE: "true"
      PORT: "3000"
      NODE_ENV: development
    volumes:
      - ./packages/server/src:/app/packages/server/src:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
    ports:
      - "3000:3000"

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile.dev
    depends_on:
      - server
    volumes:
      - ./packages/client:/app/packages/client:ro
      - ./packages/client/node_modules:/app/packages/client/node_modules
      - ./packages/domain/src:/app/packages/domain/src:ro
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data:
  minio_data:
